bundle:
  name: dot-graph-discovery
  version: 0.2.0
  description: DOT/Graphviz codebase discovery pipeline

# dot-core is included by the dot-graph.yaml umbrella — do not re-include here.

agents:
  include:
    - dot-graph:discovery-orchestrator
    - dot-graph:discovery-prescan
    - dot-graph:discovery-code-tracer
    - dot-graph:discovery-behavior-observer
    - dot-graph:discovery-integration-mapper
    - dot-graph:discovery-synthesizer
    - dot-graph:discovery-level-synthesizer
    - dot-graph:discovery-subsystem-synthesizer
    - dot-graph:discovery-overview-synthesizer
    - dot-graph:discovery-combiner
    - dot-graph:discovery-architecture-writer

# NOTE: discovery-awareness.md context has been moved to @-mention in the
# discovery-orchestrator agent (the primary sink for discovery knowledge).
# This removes ~462 tokens from always-on context for non-discovery sessions.
# See BUNDLE_GUIDE.md §"Behavior context.include Policy".
